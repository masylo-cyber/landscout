# Obszary poszukiwań. Dopasowanie: najpierw po gminie z ewidencji (ULDK), potem po promieniu od środka.
# commune: nazwa gminy wg ULDK (dla Warszawy: dzielnica w polu "region"/obręb – obsługiwane przez pole district)
# Każdy obszar ma:
#   ring: "warszawa" | "pierscien" | "dalej"  -> decyduje o progu liczby segmentów (profiles.yml)
#   profiles: do których profili trafiają oferty z tego obszaru
#   olx_region / otodom_slug: parametry wyszukiwania na portalach (uzupełniane automatycznie, gdy puste)
#   center: [lat, lon], radius_km: do filtrowania geograficznego po geokodowaniu

