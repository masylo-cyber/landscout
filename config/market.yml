# Założenia rynkowe do pro formy. WARTOŚCI STARTOWE – do korekty przez Ciebie.
# Ceny sprzedaży: zł/m² PUM BRUTTO (tak jak w ogłoszeniach); do pro formy liczone netto (VAT 8%).
# Źródła (10.2026): rynekpierwotny.pl (Wilanów śr. 18 600 brutto, Konstancin śr. 12 800, Magdalenka osiedla 8 200–8 600),
# adresowo.pl (domy, mediana/średnia: Mokotów 18.6/20.1k, Ursynów 17.3/19.3k, Wilanów 14.7/17.0k, Białołęka 11.5k, Wawer 10.1/11.0k,
# Wesoła 10.0k, Rembertów 8.4/10.6k). Premium wg użytkownika: Magdalenka/Kierszek 20 000 brutto.
sale_vat: 0.08

build_cost_pln_m2:
  galano: 5500       # bliźniaki / szeregi, stan deweloperski
  bauro: 6500        # domy premium
  mw: 7000           # wielorodzinna (z garażem podziemnym/infrastrukturą; do korekty)
soft_costs_pct: 0.12   # projekt, przyłącza, drogi wewn., nadzór, marketing, finansowanie – % kosztu budowy
sales_cost_pct: 0.02   # prowizje / notariusz – % przychodu
vat_land_note: "cena działki brutto wg ogłoszenia; dla gruntu od osoby fizycznej PCC 2%"

# Typowe metraże segmentu (m² PUM) – do szacunku PUM gdy brak intensywności w planie
unit_pum_m2:
  szereg: 130
  blizniak: 150
  wolnostojacy_galano: 170
  wolnostojacy_bauro: 300

# Domyślne parametry gdy nie da się odczytać z MPZP (oznaczane jako szacunek)
defaults:
  floor_area_ratio_galano: 0.35   # intensywność (PUM / pow. działki) – ostrożnie
  floor_area_ratio_bauro: 0.20
  floor_area_ratio_mw: 1.0        # intensywność brutto dla MW bez danych z planu (ostrożnie); PUM ≈ 0.75 × pow. całk.
  usable_factor: 0.85             # część działki po odjęciu dróg/odstępów

# Ceny sprzedaży zł/m² PUM wg obszaru (klucz = fragment nazwy obszaru z areas.yml; dopasowanie po początku)
