services:
  db:
    logging: {driver: json-file, options: {max-size: \"20m\", max-file: \"3\"}}
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: landscout
      POSTGRES_USER: landscout
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscout"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    logging: {driver: json-file, options: {max-size: \"20m\", max-file: \"3\"}}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://landscout:${DB_PASSWORD}@db:5432/landscout
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - appdata:/app/data
    command: ["landscout", "serve"]

  scheduler:
    logging: {driver: json-file, options: {max-size: \"20m\", max-file: \"3\"}}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://landscout:${DB_PASSWORD}@db:5432/landscout
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - appdata:/app/data
    command: ["landscout", "loop"]

volumes:
  dbdata:
  appdata:
